<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>รายงาน Green Office 6.1(2) • งานพัสดุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#1F4E79;--navy2:#2B5F8E;--ink:#1F2933;--mute:#5F6B7A;--line:#DCE3EA;--bg:#F4F6F9;--card:#fff;--green:#1E6B30;--greenbg:#E3F4E8;--red:#B42318;--redbg:#FDE8E7;--amber:#8A5A00;--amberbg:#FFF4D6}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif;font-size:15px;color:var(--ink);background:var(--bg);line-height:1.5}
  header{background:var(--navy);color:#fff;padding:14px 16px}
  header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600} header .who{margin-left:auto;font-size:13px;opacity:.9}
  header a{color:#fff}
  .wrap{max-width:1200px;margin:0 auto}
  nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 8px}
  nav button{font:inherit;border:0;background:none;padding:12px 14px;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
  main{padding:16px}
  section{display:none} section.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:17px;margin:0 0 10px;color:var(--navy)} h3{font-size:15px;margin:0 0 8px}
  label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
  input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid #A9C3DF;border-color:var(--navy)}
  .grid{display:grid;gap:10px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}} @media (max-width:460px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .btn{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#E6ECF2;color:var(--navy);font-weight:500}
  .btn.pri{background:var(--navy);color:#fff} .btn.danger{background:var(--redbg);color:var(--red)} .btn.sm{padding:4px 10px;font-size:13px}
  .btn:disabled{opacity:.6;cursor:wait}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#FAFBFC;position:relative}
  .item .rm{position:absolute;top:8px;right:10px}
  .tot{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;font-weight:600;margin:10px 0}
  .green{color:var(--green)} .muted{color:var(--mute)} .small{font-size:13px}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;display:none} .msg.ok{display:block;background:var(--greenbg);color:var(--green)} .msg.err{display:block;background:var(--redbg);color:var(--red)}
  .tbl{width:100%;border-collapse:collapse;font-size:14px} .tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
  .tbl th{background:#EEF2F6;font-weight:600;text-align:center} .num{text-align:right;white-space:nowrap} .c{text-align:center}
  .scroll{overflow-x:auto}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;background:#EEF2F6;color:var(--mute);white-space:nowrap}
  .badge.g{background:var(--greenbg);color:var(--green)} .badge.w{background:var(--amberbg);color:var(--amber)}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px} @media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px} .kpi b{display:block;font-size:20px} .kpi span{font-size:12.5px;color:var(--mute)}
  .bar{height:10px;background:#E6ECF2;border-radius:6px;overflow:hidden;min-width:80px} .bar i{display:block;height:100%;background:#2E7D32}
  dialog{border:0;border-radius:12px;padding:0;width:min(640px,96vw)} dialog::backdrop{background:rgba(15,25,40,.45)}
  dialog .hd{background:var(--navy);color:#fff;padding:12px 16px;font-weight:600} dialog .bd{padding:14px 16px;max-height:70vh;overflow:auto} dialog .ft{padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
  #gate{max-width:520px;margin:60px auto;text-align:center}
  /* ---------- แบบฟอร์ม 6.1(2) ---------- */
  .form612{background:#fff;color:#000;font-size:15px}
  .form612 .r{text-align:right} .form612 .t{text-align:center;font-weight:700}
  .form612 table{width:100%;border-collapse:collapse;margin-top:6px} .form612 th,.form612 td{border:1px solid #555;padding:4px 6px}
  .form612 th{background:#D9E2F3;font-weight:700;text-align:center} .form612 tr.cat td{background:#E6ECF2;font-weight:700}
  .form612 td.g{color:var(--green)} .form612 .sum td:first-child{text-align:left}
  .form612 .blk{margin-top:14px} .form612 .blk p{margin:2px 0 2px 28px}
  @media print{
    @page{size:A4 landscape;margin:12mm}
    body{background:#fff} header,nav,.noprint,section:not(#tab-report){display:none!important} main{padding:0}
    #tab-report{display:block!important} #tab-report .card{border:0;padding:0;margin:0}
    .form612{font-size:12.5pt} .form612 thead{display:table-header-group} .form612 tr{page-break-inside:avoid}
  }
  /* ---------- ภาพรวม ---------- */
  .kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))} @media (max-width:760px){.kpis.k6{grid-template-columns:1fr 1fr}}
  .kpi.b{border-left:5px solid #2C6E9E} .kpi.a{border-left:5px solid #B8863B}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:12px} .charts .wide{grid-column:1/-1} @media (max-width:760px){.charts{grid-template-columns:1fr}}
  .hb{display:grid;grid-template-columns:minmax(90px,32%) 1fr 110px;gap:8px;align-items:center;margin:4px 0;font-size:13.5px}
  .hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hb .hbar{background:#E6ECF2;border-radius:6px;height:14px;overflow:hidden} .hb .hbar i{display:block;height:100%}
  .hb .hv{text-align:right}
  @media print{.noprint{display:none!important}}

  /* ---------- ธีมเขียวเข้ม-ครีม (แบบหน้าเดิม) ---------- */
  :root{--navy:#1F4D3D;--navy2:#2F7A4F;--ink:#20261F;--mute:#5C6B58;--line:#C9DBC9;--bg:#FBFAF6;--green:#2F7A4F;--greenbg:#E8EFE6}
  header{background:linear-gradient(90deg,#123326,#1F4D3D)}
  nav button[aria-selected=true]{color:#1F4D3D;border-bottom-color:#B8863B}
  h2{color:#123326} .btn.pri{background:#1F4D3D} .btn.pri:hover{background:#123326}
  .card{box-shadow:0 1px 2px rgba(18,51,38,.06)} .tbl th{background:#E8EFE6;color:#123326}
  input:focus,select:focus,textarea:focus{outline:2px solid #B9D3BE;border-color:#1F4D3D}
  .kpi{border-left:5px solid #2F7A4F} .kpi.b{border-left-color:#2C6E9E} .kpi.a{border-left-color:#B8863B}
  .toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .modal{position:fixed;inset:0;background:rgba(18,51,38,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
  .modal[hidden]{display:none} .modalbox{background:#fff;border-radius:12px;padding:18px;max-width:760px;width:100%}
  .lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle}

  /* ---------- เมนูแถบด้านซ้าย ---------- */
  #app:not([hidden]){display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
  body.sb{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start} body.sb>header{grid-column:1/-1} body.sb>nav{grid-column:1} body.sb>main{grid-column:2}
  nav{background:linear-gradient(180deg,#1F4D3D,#123326);border-bottom:0;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
  nav .wrap{flex-direction:column;gap:2px;padding:10px;overflow:visible}
  nav button{color:#DCECE3;text-align:left;border-bottom:0;border-radius:8px;padding:9px 12px;white-space:normal;width:100%;font-size:14px}
  nav button:hover{background:rgba(255,255,255,.1)}
  nav button[aria-selected=true]{background:#B8863B;color:#fff;font-weight:700;border-bottom:0}
  @media (max-width:900px){
    #app:not([hidden]),body.sb{grid-template-columns:1fr} body.sb>main{grid-column:1} nav{position:static;max-height:none}
    nav .wrap{flex-direction:row;overflow-x:auto} nav button{width:auto;white-space:nowrap}
  }
</style>
<body class="sb">
<header><div class="wrap"><h1>🌿 Green Office • รายงานการจัดซื้อที่เป็นมิตรกับสิ่งแวดล้อม (แบบฟอร์ม 6.1 (2))</h1>
  <div class="who"><span>วิทยาลัยพยาบาลบรมราชชนนี สุรินทร์ • งานพัสดุ</span></div></div></header>
<nav><div class="wrap" role="tablist">
  <button role="tab" data-tab="dash" aria-selected="true">📊 ภาพรวม</button>
  <button role="tab" data-tab="report" aria-selected="false">📄 รายงานฉบับเต็ม (แบบฟอร์ม 6.1(2))</button>
</div></nav>
<main class="wrap">
  <div class="card noprint">
    <div class="row">
      <div><label for="r-fy">ปีงบประมาณ</label><input id="r-fy" type="number" min="2560" max="2600" style="width:110px"></div>
      <div id="r-perbox" hidden><label for="r-per">ช่วงรายงาน</label><select id="r-per" style="width:170px"></select></div>
      <button class="btn pri" id="r-go" type="button">แสดงข้อมูล</button>
      <button class="btn" id="r-print" type="button" disabled>พิมพ์ / บันทึก PDF</button>
    </div>
    <div id="r-msg" class="msg" role="status"></div>
    <p class="muted small">หน้านี้แสดงเฉพาะรายงานสรุปผล Green Office ไม่แสดงข้อมูลร้านค้า ชื่อผู้รับจ้าง เลขที่ใบสั่งซื้อ หรือหลักฐานภายใน</p>
  </div>
  <section id="tab-dash" class="on"><div id="d-out"><p class="muted">กำลังโหลด…</p></div></section>
  <section id="tab-report"><div class="card"><div id="r-out" class="form612"><p class="muted">เลือกปีงบประมาณและช่วงรายงาน แล้วกด "แสดงข้อมูล"</p></div></div></section>
</main>
<script src="js/go-config.js"></script>
<script src="js/go-core.js"></script>
<script src="js/go-report.js"></script>
</body>
</html>
