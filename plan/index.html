<!DOCTYPE html>
<html lang="th">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบตรวจโครงการและแผนจัดซื้อจัดจ้าง</title>
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2421; --muted:#5d6762; --line:#d9ddd7;
  --brand:#1f5d4c; --brand-2:#e6f0ec; --accent:#b8722c;
  --ok:#2f7d4f; --ok-bg:#e5f3ea; --warn:#9a6a00; --warn-bg:#fbf1d6; --bad:#a63b2f; --bad-bg:#f8e3df; --info:#2d5a8a; --info-bg:#e3ecf6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Sarabun","TH Sarabun New","TH SarabunPSK","Leelawadee UI",Tahoma,sans-serif;font-size:15px;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--brand);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px}
header.top .sub{opacity:.8;font-size:13px}
header.top .sp{flex:1}
header.top select{background:#fff;color:var(--ink);border:0;border-radius:6px;padding:4px 8px;font-weight:600}
nav.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:11px 16px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
main{padding:18px 20px 60px;max-width:1400px;margin:0 auto}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:16px;margin:18px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:2px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#f0f2ee;font-weight:600;font-size:14px;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:hover td{background:#fafbf8}
table.t tr.sum td{font-weight:700;background:#f0f2ee}
.tag{display:inline-block;border-radius:20px;padding:0 9px;font-size:13px;white-space:nowrap}
.s-new{background:#eceeea;color:var(--muted)} .s-fix{background:var(--warn-bg);color:var(--warn)} .s-ok{background:var(--info-bg);color:var(--info)}
.s-signed{background:var(--ok-bg);color:var(--ok)} .s-cancel{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.bar{height:8px;background:#e8ebe6;border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--bad)}
.warn-list{margin:6px 0 0;padding-left:20px}
.warn-list li.bad{color:var(--bad)} .warn-list li.w{color:var(--warn)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.link{color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(1180px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.narrow{width:min(640px,100%)}
.modal .mh{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal .mh h3{margin:0;flex:1}
.modal .mb{padding:14px 18px;max-height:calc(100vh - 170px);overflow:auto}
.modal .mf{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field input,.field select,.field textarea{width:100%}
.field input[type=checkbox]{width:auto}
table.items{min-width:1240px}
.modal{width:min(1340px,100%)}
.dthint{font-size:12px;color:var(--muted);margin-left:4px;white-space:nowrap}
table.items td{padding:3px 4px}
table.items input,table.items select{width:100%}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;min-width:250px}
.months label{font-size:11px;text-align:center;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:1px 0;user-select:none}
.months label.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.months input{display:none}
tr.cancelled td{opacity:.5;text-decoration:line-through}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2421;color:#fff;padding:9px 18px;border-radius:8px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.notice{background:var(--warn-bg);border:1px solid #ecd9a0;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.chk-round{display:grid;grid-template-columns:150px 1fr auto;gap:6px;align-items:center;margin-bottom:4px}
@media (max-width:700px){main{padding:12px}.chk-round{grid-template-columns:1fr}}
/* print */
#print{display:none}
@media print{
  body{background:#fff}
  #app,.modal-back,.toast{display:none!important}
  #print{display:block}
}
#print{font-family:"TH SarabunIT๙","TH SarabunPSK","TH Sarabun New","Sarabun",sans-serif;font-size:15pt;color:#000;line-height:1.35}
#print .ptitle{text-align:center;font-weight:700;font-size:16pt}
#print table{width:100%;border-collapse:collapse;font-size:13pt}
#print th,#print td{border:1px solid #000;padding:1px 4px;vertical-align:top}
#print th{text-align:center;font-weight:700}
#print td.n{text-align:right;white-space:nowrap}
#print td.c{text-align:center}
#print .sigs{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:28px;row-gap:26px;page-break-inside:avoid}
#print .memo{font-size:16pt}
#print .memo p{margin:0;text-align:justify;text-justify:inter-character}
#print table.sigt td{border:none;text-align:center;vertical-align:top;padding:0 0 18pt}
#print .memo .ind{text-indent:2.5cm}
#print .memo .hd{display:flex;gap:8px}
#print .pb{page-break-after:always}
#print td.m{padding:0;vertical-align:middle;position:relative}
#print table.plan{table-layout:fixed}#print table.plan td{word-wrap:break-word}
#print p.mh{display:flex;align-items:baseline;gap:4px;text-align:left}
#print .dl{flex:1;border-bottom:1px dotted #000;padding-left:2px}
#print .dlt{border-bottom:none;text-decoration:underline dotted;text-underline-offset:4px}
#print .brc{position:absolute;left:1px;top:3px;width:9px;height:20px;z-index:2}
#print .arwL{position:absolute;left:3px;top:50%;height:0;width:14px;border-top:1.3px solid #000;z-index:3}
#print .arwL::before{content:'';position:absolute;left:-1px;top:-4.6px;border-right:7px solid #000;border-top:4px solid transparent;border-bottom:4px solid transparent}
#print .arwL::after{content:'';position:absolute;right:-1px;top:-4.6px;border-left:7px solid #000;border-top:4px solid transparent;border-bottom:4px solid transparent}
#print .arw{position:relative;height:0;border-top:1.3px solid #000}
#print .arw.s{margin-left:3px}#print .arw.e{margin-right:3px}
#print .arw.s::before{content:'';position:absolute;left:-1px;top:-4.6px;border-right:7px solid #000;border-top:4px solid transparent;border-bottom:4px solid transparent}
#print .arw.e::after{content:'';position:absolute;right:-1px;top:-4.6px;border-left:7px solid #000;border-top:4px solid transparent;border-bottom:4px solid transparent}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>ระบบตรวจโครงการและแผนปฏิบัติการจัดซื้อจัดจ้าง</h1>
      <div class="sub">ส่วนพัสดุและทรัพย์สิน · วิทยาลัยพยาบาลบรมราชชนนี สุรินทร์</div>
    </div>
    <div class="sp"></div>
    <button class="btn sm" data-act="backup" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">สำรองข้อมูล</button><button class="btn sm" data-act="restore" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">กู้คืนข้อมูล</button><label>ปีงบประมาณ <select id="fySel"></select></label>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="print"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
/* ================= ONLINE: Supabase login + shared data (เฉพาะเจ้าหน้าที่พัสดุ) ================= */
const CLOUD=(()=>{
  const DEF_PW='123456789';
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  let VER=0,pending=false,saving=false,timer=null,lastBy='',lastAt='',me='',pollT=null,started=false,blocked=false;
  const $=id=>document.getElementById(id);
  const fmtT=iso=>{if(!iso)return '';const d=new Date(iso);const loc=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `${thDate(loc)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`};
  function status(t,warn){const el=$('cloudSt');if(el){el.textContent=t;el.style.color=warn?'#ffd7a8':''}}
  function showStatus(){status(pending||saving?'☁ กำลังบันทึก…':`☁ บันทึกแล้ว${lastAt?' '+fmtT(lastAt):''}${lastBy?' · '+lastBy.split('@')[0]:''}`)}

  /* ---------- login screen ---------- */
  function gate(html){let g=$('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
    g.innerHTML=`<div class="modal-back" style="z-index:200;background:#eef2ee"><div class="modal narrow" style="max-width:430px;margin-top:8vh"><div class="mh"><h3>ระบบตรวจโครงการและแผนจัดซื้อจัดจ้าง</h3></div><div class="mb">${html}</div></div></div>`;
    g.querySelectorAll('input[type=password]').forEach(addEye)}
  function closeGate(){const g=$('gate');if(g)g.remove()}
  function addEye(inp){if(inp.dataset.eye)return;inp.dataset.eye=1;const b=document.createElement('button');b.type='button';b.className='btn sm';b.textContent='👁';b.title='แสดง/ซ่อนรหัสผ่าน';b.style.marginLeft='6px';
    b.onclick=()=>{inp.type=inp.type==='password'?'text':'password'};inp.style.width='calc(100% - 52px)';inp.after(b)}
  function loginView(msg){
    gate(`<p class="small muted" style="margin-top:0">สำหรับเจ้าหน้าที่ส่วนพัสดุและทรัพย์สินเท่านั้น · เข้าระบบด้วยอีเมลองค์กร</p>
      <div class="field"><label>อีเมลองค์กร</label><input type="email" id="gEmail" autocomplete="username" placeholder="ชื่อ@bcnsurin.ac.th"></div>
      <div class="field"><label>รหัสผ่าน</label><input type="password" id="gPw" autocomplete="current-password"></div>
      <div class="small" id="gMsg" style="color:var(--bad);min-height:1.2em"></div>
      <div class="row"><button class="btn pri" id="gLogin">เข้าสู่ระบบ</button><span class="grow"></span><span class="link small" id="gForgot">ลืมรหัสผ่าน</span></div>`);
    if(msg)$('gMsg').textContent=msg;
    const go=async()=>{const email=$('gEmail').value.trim().toLowerCase(),pw=$('gPw').value;$('gMsg').textContent='';
      if(!email||!pw){$('gMsg').textContent='กรอกอีเมลและรหัสผ่าน';return}
      $('gLogin').disabled=true;const {error}=await sb.auth.signInWithPassword({email,password:pw});$('gLogin').disabled=false;
      if(error){$('gMsg').textContent=/Invalid login/i.test(error.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':'เข้าสู่ระบบไม่สำเร็จ: '+error.message;return}
      if(pw===DEF_PW){try{sessionStorage.setItem('mustChangePw','1')}catch(e){}}
      afterLogin()};
    $('gLogin').onclick=go;$('gPw').onkeydown=e=>{if(e.key==='Enter')go()};
    $('gForgot').onclick=async()=>{const email=$('gEmail').value.trim().toLowerCase();if(!email){$('gMsg').textContent='พิมพ์อีเมลองค์กรก่อน แล้วกด "ลืมรหัสผ่าน"';return}
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      $('gMsg').style.color=error?'var(--bad)':'var(--ok)';$('gMsg').textContent=error?'ส่งลิงก์ไม่สำเร็จ: '+error.message:'ถ้าอีเมลนี้มีบัญชีในระบบ จะได้รับลิงก์ตั้งรหัสใหม่ทางอีเมลองค์กร (ตรวจในกล่องจดหมายขยะด้วย)'}}
  function pwView(forced,recovery){
    gate(`<h3 style="margin-top:0">${recovery?'ตั้งรหัสผ่านใหม่':forced?'กรุณาเปลี่ยนรหัสผ่านตั้งต้นก่อนใช้งาน':'เปลี่ยนรหัสผ่าน'}</h3>
      ${forced||recovery?'':`<div class="field"><label>รหัสผ่านปัจจุบัน</label><input type="password" id="pCur" autocomplete="current-password"></div>`}
      <div class="field"><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</label><input type="password" id="pNew" autocomplete="new-password"></div>
      <div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="pNew2" autocomplete="new-password"></div>
      <div class="small" id="pMsg" style="color:var(--bad);min-height:1.2em"></div>
      <div class="row"><button class="btn pri" id="pSave">บันทึกรหัสผ่านใหม่</button><span class="grow"></span>${forced||recovery?'<button class="btn" id="pOut">ออกจากระบบ</button>':'<button class="btn" id="pCancel">ยกเลิก</button>'}</div>`);
    if($('pOut'))$('pOut').onclick=logout;if($('pCancel'))$('pCancel').onclick=closeGate;
    $('pSave').onclick=async()=>{const n=$('pNew').value,n2=$('pNew2').value,msg=t=>$('pMsg').textContent=t;
      if(n.length<8)return msg('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัว');if(n===DEF_PW)return msg('ห้ามใช้รหัสตั้งต้น');if(n!==n2)return msg('ยืนยันรหัสผ่านไม่ตรงกัน');
      if($('pCur')){const cur=$('pCur').value;if(cur===n)return msg('รหัสใหม่ต้องไม่ซ้ำรหัสเดิม');const {error}=await sb.auth.signInWithPassword({email:me,password:cur});if(error)return msg('รหัสผ่านปัจจุบันไม่ถูกต้อง')}
      const {error}=await sb.auth.updateUser({password:n});if(error)return msg(/different from the old/i.test(error.message)?'รหัสใหม่ต้องไม่ซ้ำรหัสเดิม':'เปลี่ยนรหัสไม่สำเร็จ: '+error.message);
      try{sessionStorage.removeItem('mustChangePw')}catch(e){}closeGate();toast('เปลี่ยนรหัสผ่านแล้ว');if(!started)afterLogin()}}
  function privacyView(){
    gate(`<h3 style="margin-top:0">ประกาศความเป็นส่วนตัว (ย่อ)</h3><div class="small" style="line-height:1.7">
      ระบบนี้เก็บข้อมูลส่วนบุคคลเท่าที่จำเป็นต่องานจัดซื้อจัดจ้าง ได้แก่ ชื่อ-สกุลและตำแหน่งของผู้รับผิดชอบโครงการและคณะกรรมการ ชื่อผู้ขาย/ผู้รับจ้าง และอีเมลองค์กรของเจ้าหน้าที่ผู้บันทึก
      เพื่อปฏิบัติภารกิจของรัฐและหน้าที่ตามกฎหมายว่าด้วยการจัดซื้อจัดจ้างและการบริหารพัสดุภาครัฐ (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล ม.24(4) และ (6))
      ข้อมูลเก็บที่ Supabase (ศูนย์ข้อมูลสิงคโปร์) และหน้าเว็บให้บริการโดย Vercel เข้าถึงได้เฉพาะเจ้าหน้าที่ส่วนพัสดุและทรัพย์สินที่ได้รับสิทธิ์
      ไม่เปิดเผยต่อบุคคลภายนอก เว้นแต่ตามกฎหมาย ผู้มีข้อมูลขอเข้าถึง แก้ไข หรือคัดค้านได้ที่ส่วนพัสดุและทรัพย์สิน วิทยาลัยพยาบาลบรมราชชนนี สุรินทร์</div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="pvOk">รับทราบ</button></div>`);
    $('pvOk').onclick=()=>{try{localStorage.setItem('planPrivacyAck:'+me,'1')}catch(e){}closeGate();afterLogin()}}

  /* ---------- data ---------- */
  async function fetchRow(){const {data,error}=await sb.from('plan_state').select('data,version,updated_by,updated_at').eq('id','main').maybeSingle();if(error)throw error;return data}
  function apply(row){VER=row?row.version:0;lastBy=row?row.updated_by||'':'';lastAt=row?row.updated_at||'':'';load(row?row.data:null)}
  async function afterLogin(){
    const {data:{user}}=await sb.auth.getUser();if(!user)return loginView();me=(user.email||'').toLowerCase();
    let must=false;try{must=sessionStorage.getItem('mustChangePw')==='1'}catch(e){}if(must)return pwView(true);
    const {data:mem}=await sb.rpc('is_plan_member');if(!mem){await sb.auth.signOut();return loginView('บัญชี '+me+' ยังไม่ได้รับสิทธิ์ใช้ระบบนี้ (เฉพาะเจ้าหน้าที่พัสดุ) ติดต่อผู้ดูแลระบบ')}
    let ack=false;try{ack=localStorage.getItem('planPrivacyAck:'+me)==='1'}catch(e){}if(!ack)return privacyView();
    let row;try{row=await fetchRow()}catch(e){return loginView('อ่านข้อมูลไม่ได้ ('+(e.message||e)+')')}
    apply(row);closeGate();started=true;renderStaffList();renderUnitList();render();showStatus();
    if(!row)toast('ยังไม่มีข้อมูลในระบบออนไลน์ — กด "กู้คืนข้อมูล" แล้วเลือกไฟล์สำรองจากเครื่องเพื่อย้ายข้อมูลขึ้นระบบ');
    clearInterval(pollT);pollT=setInterval(poll,20000)}
  function dirty(){pending=true;showStatus();clearTimeout(timer);timer=setTimeout(push,1200)}
  async function push(){if(saving||blocked){if(!blocked)timer=setTimeout(push,800);return}saving=true;pending=false;showStatus();
    const snap=JSON.parse(JSON.stringify(S));
    const {data,error}=await sb.rpc('save_plan_state',{p_data:snap,p_version:VER});saving=false;

    closeModal();apply(row);blocked=false;render();showStatus()}
  async function poll(){if(pending||saving||blocked||document.hidden)return;if(document.getElementById('modal').innerHTML)return;
    const {data}=await sb.from('plan_state').select('version,updated_by,updated_at').eq('id','main').maybeSingle();

  async function logout(){if(pending||saving){await push()}clearInterval(pollT);await sb.auth.signOut();started=false;S=null;try{sessionStorage.removeItem('mustChangePw')}catch(e){}document.getElementById('view').innerHTML='';loginView()}

  return {sb,boot,dirty,push,logout};
})();

function parseThaiDate(s){ // "1 ตุลาคม 2569"
  if(!s)return null;s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  m=s.match(/(\d{1,2})\s*([ก-๙\.]+)\s*(\d{2,4})/);if(!m)return null;
  let mi=TH_MONTHS.findIndex(x=>m[2].startsWith(x));if(mi<0)mi=TH_MONTHS_S.findIndex(x=>x===m[2]||x.replace(/\./g,'')===m[2].replace(/\./g,''));
  if(mi<0)return null;let y=Number(m[3]);if(y<100)y+=2500;y-=543;
  return y+'-'+String(mi+1).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');

function staff(){return S.settings.staff||((S.settings.staffList||[]).length?S.settings.staffList:STAFF_DEFAULT)}
function staffFind(name){const n=norm(name);return staff().find(x=>norm(x.name)===n)}
const TITLE_RE=/^(ผู้ช่วยศาสตราจารย์|รองศาสตราจารย์|ศาสตราจารย์|ผศ\.|รศ\.|ดร\.|นางสาว|น\.ส\.|นาง|นาย|อาจารย์|อ\.|คุณ)\s*/;
function stripTitle(x){let s=String(x||'').trim(),o;do{o=s;s=s.replace(TITLE_RE,'')}while(s!==o);return s.trim()}
function staffGuess(token){ // legacy short names like "อ.วรวุฒิ"

/* ================= status & auto checks ================= */
function classify(res){
  res=String(res||'');const st=S&&S.settings||{};const parts=res.split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean);
  if(parts.length&&parts.some(x=>(st.chkSigned||[]).includes(x)))return 'signed';
  if(parts.length&&parts.every(x=>(st.chkOk||[]).includes(x)))return 'ok';
  if(/ยกเลิก/.test(res))return 'cancel';
  if(/ลงชื่อ/.test(res))return 'signed';
  if(/^(ไม่มีแก้ไข|ไม่มีรายการซื้อ)/.test(res))return 'ok';
  return 'fix';
}
function pStatus(p){
  if(p.cancelled)return 'cancel';
  if(!p.checks.length)return 'new';
  const last=p.checks[p.checks.length-1];
  if(!last.result||!String(last.result).trim())return 'wait';
  const c=classify(last.result);
  if(c==='fix')return last.sentBack?'fix':'tosend';
  return c;
}
function roundRecv(p,k){const c=p.checks[k];return c.recvDate||(k===0?p.submitDate:null)}
function timeline(p){ // days at supply section vs at project owner
  let sup=0,own=0,ownNow=null;
  p.checks.forEach((c,k)=>{const r=roundRecv(p,k);const d=daysBetween(r,c.date);if(d!==null&&d>=0)sup+=d;
    if(c.sentBack){const n=p.checks[k+1];if(n&&n.recvDate){const x=daysBetween(c.sentBack,n.recvDate);if(x!==null&&x>=0)own+=x}else if(!n&&classify(c.result)==='fix'){ownNow=daysBetween(c.sentBack,todayISO());if(ownNow>=0)own+=ownNow}}});
  return {sup,own,ownNow};
}
function canSignSameRound(p){const last=p.checks[p.checks.length-1];return !!(last&&(last.result||'').trim()&&classify(last.result)==='ok'&&!last.sentBack)}
function addRound(p,result,opt={}){
  const last=p.checks[p.checks.length-1];
  if(classify(result)==='signed'&&!opt.forceNew&&canSignSameRound(p)){ // sign in the same round (already checked OK, not yet returned)
    last.prevResult=last.result;last.result=last.result+'; '+result;last.signDate=opt.date||todayISO();last.signMerged=true;
    if(opt.sentBack)last.sentBack=opt.sentBack;if(p.hasBuy)last.snap=snapItems(p);return last}
  let c;if(last&&!(last.result||'').trim()){c=last}else{c={recvDate:opt.recvDate||(p.checks.length?todayISO():p.submitDate||todayISO()),date:'',result:'',sentBack:'',note:''};p.checks.push(c)}
  c.date=opt.date||c.date||todayISO();c.result=result;
  if(opt.areas)c.areas=opt.areas;else if(classify(result)==='fix'&&!c.areas)c.areas=guessAreas(result);
  if(p.hasBuy)c.snap=snapItems(p);
  if(opt.sentBack)c.sentBack=opt.sentBack;else if(classify(result)==='fix'&&opt.sentBack!==false)c.sentBack=c.date;
  if(!p.submitDate)p.submitDate=c.recvDate||c.date;
  return c;
}
const AREAS=['พัสดุ','แผน','การเงิน'];
function guessAreas(r){const a=[];if(/แผน|ยุทธศาสตร์|ตัวชี้วัด/.test(r))a.push('แผน');if(/การเงิน|เบิก|ค่าตอบแทน|ใช้สอย/.test(r))a.push('การเงิน');if(!a.length||/วัสดุ|จ้าง|เช่า|ครุภัณฑ์|ราคา|หน่วยนับ|หมวดเงิน|รายการ|ยอดเงิน/.test(r))a.unshift('พัสดุ');return [...new Set(a)]}
function snapItems(p){return activeItems(p).map(i=>({id:i.id,name:i.name,qty:i.qty,unit:i.unit,budget:num(i.budget),fund:i.fund}))}
function diffSnap(a,b){ // a = previous round, b = this round
  if(!a||!b)return [];const out=[];const A=new Map(a.map(i=>[i.id,i])),B=new Map(b.map(i=>[i.id,i]));
  b.forEach(i=>{const o=A.get(i.id);if(!o){out.push(`+ เพิ่ม ${i.name} ${money(i.budget)}`);return}
    const ch=[];if(o.name!==i.name)ch.push(`ชื่อ "${o.name}" → "${i.name}"`);if(num(o.qty)!==num(i.qty)||o.unit!==i.unit)ch.push(`จำนวน ${o.qty??''} ${o.unit||''} → ${i.qty??''} ${i.unit||''}`);if(num(o.budget)!==num(i.budget))ch.push(`งบ ${money(o.budget)} → ${money(i.budget)}`);if(o.fund!==i.fund)ch.push(`หมวด ${o.fund||'-'} → ${i.fund||'-'}`);
    if(ch.length)out.push(`~ ${i.name}: ${ch.join(', ')}`)});
  a.forEach(o=>{if(!B.has(o.id))out.push(`− ตัด ${o.name} ${money(o.budget)}`)});
  const ta=sum(a,i=>num(i.budget)),tb=sum(b,i=>num(i.budget));if(out.length&&ta!==tb)out.push(`รวม ${money(ta)} → ${money(tb)} (${tb>ta?'+':''}${money(tb-ta)})`);
  return out;
}
function roundDiff(p,k){const c=p.checks[k];if(!c.snap)return [];for(let j=k-1;j>=0;j--){if(p.checks[j].snap)return diffSnap(p.checks[j].snap,c.snap)}return []}
function migrateChecks(){
  S.projects.forEach(p=>{if(p._ckv===2)return;p.checks.forEach((c,k)=>{c.recvDate=c.recvDate||(k===0?(p.submitDate||c.date):'');c.sentBack=c.sentBack||'';
    const n=p.checks[k+1];if(classify(c.result)==='fix'&&!c.sentBack&&(n||p.fy<currentFY())){c.sentBack=c.date;if(n&&!n.recvDate)n.recvDate=n.date}});p._ckv=2});
}
function signedDate(p){const c=p.checks.find(c=>classify(c.result)==='signed');return c?(c.signDate||c.date):null}
function daysBetween(a,b){if(!a||!b)return null;return Math.round((new Date(b)-new Date(a))/864e5)}
function autoCheck(p){
  const w=[];const items=activeItems(p);
  if(!p.name.trim())w.push(['bad','ยังไม่มีชื่อโครงการ']);
  if(!p.owners||!p.owners.length)w.push(['w','ยังไม่ระบุผู้รับผิดชอบโครงการ']);
  (p.owners||[]).forEach(o=>{if(!staffFind(o.name))w.push(['w',`ผู้รับผิดชอบ "${o.name}" ไม่อยู่ในไฟล์รายชื่อบุคลากร`])});
  if(p.hasBuy===null||p.hasBuy===undefined){w.push(['bad','ยังไม่ได้ติ๊กว่าโครงการมีรายการซื้อ/จ้าง/เช่าหรือไม่']);return w}
  if(p.hasBuy===false){w.push(['info','ไม่มีรายการซื้อ/จ้าง/เช่า (ไม่ต้องเข้าแผน)']);return w}
  if(!items.length){w.push(['bad','ติ๊กว่ามีรายการซื้อ/จ้าง/เช่า แต่ยังไม่ได้ลงรายการ']);return w}
  const seen={};
  items.forEach((i,k)=>{
    const L=`รายการที่ ${k+1}`;
    if(!i.name.trim())w.push(['bad',L+': ยังไม่มีชื่อรายการ']);
    if(!(num(i.budget)>0))w.push(['bad',L+': ยังไม่มีงบประมาณ']);
    if(!i.fund)w.push(['bad',L+': ยังไม่ระบุหมวดเงิน']);
    if(!i.unit)w.push(['w',L+': ยังไม่ระบุหน่วยนับ']);
    if(!(num(i.qty)>0))w.push(['w',L+': ยังไม่ระบุจำนวน']);
    if(!i.months.length)w.push(['w',L+': ยังไม่ระบุเดือนที่จะจัดซื้อจัดจ้าง']);
    const pre=(i.name||'').trim().slice(0,6);
    if(i.name&&!/^จัด(ซื้อ|จ้าง|เช่า)/.test(i.name.trim()))w.push(['w',L+': ชื่อรายการควรขึ้นต้นด้วย "จัดซื้อ/จัดจ้าง/จัดเช่า"']);
    else if(i.name){const k2=/^จัดซื้อ/.test(i.name)?'ซื้อ':/^จัดจ้าง/.test(i.name)?'จ้าง':'เช่า';if(i.kind&&k2!==i.kind)w.push(['w',L+`: ชื่อขึ้นต้นด้วย "จัด${k2}" แต่ประเภทเลือกเป็น "${i.kind}"`])}
    if(num(i.budget)>500000&&i.method==='เฉพาะเจาะจง')w.push(['w',L+': วงเงินเกิน 500,000 บาท ตรวจสอบวิธีการจัดหาอีกครั้ง']);
    const nk=norm(i.name);if(nk&&seen[nk])w.push(['w',L+': ชื่อซ้ำกับรายการที่ '+seen[nk]]);seen[nk]=k+1;
  });
  const tot=sum(items,i=>num(i.budget));
  if(p.budgetTotal&&Math.abs(num(p.budgetTotal)-tot)>0.009)w.push(['bad',`ยอดรวมรายการ ${money(tot)} ไม่ตรงกับวงเงินในโครงการ ${money(p.budgetTotal)} (ต่าง ${money(tot-num(p.budgetTotal))})`]);
  return w;
}

function unsign(p){const k=[...p.checks].map((c,i)=>[c,i]).reverse().find(([c])=>classify(c.result)==='signed');if(!k)return false;const c=k[0];if(c.signMerged){c.result=c.prevResult||'';delete c.prevResult;delete c.signDate;delete c.signMerged;return true}p.checks.splice(k[1],1);return true}
function lastTxt(p){
  const c=p.checks[p.checks.length-1];if(!c)return '–';
  if(!c.result)return `รับคืน ${thDate(c.recvDate)}`;
  if(c.sentBack)return `ส่งกลับ ${thDate(c.sentBack)} · ${esc(c.result)}${c.areas&&c.areas.length?' <span class="muted">('+c.areas.join('/')+')</span>':''}`;
  if(classify(c.result)==='signed')return `ลงนาม ${thDate(c.date)} · ${esc(c.result)}${c.sentBack?' · ส่งคืน '+thDate(c.sentBack):' · <span style="color:var(--accent)">ยังไม่ส่งคืน</span>'}`;
  if(c.sentBack)return `${thDate(c.date)} · ${esc(c.result)} · ส่งคืน ${thDate(c.sentBack)}`;
  return `${thDate(c.date)} · ${esc(c.result)}`;
}

function planLabel(p){
  if(!activeItems(p).length&&!p.planBatch)return '<span class="muted">–</span>';
  const b=S.batches.find(x=>x.id===p.planBatch);
  let s=b?`อนุมัติครั้งที่ ${b.no}`:(p.hasBuy!==false&&activeItems(p).length?'<b style="color:var(--accent)">รอเข้าแผน</b>':'<span class="muted">ยังไม่เข้าแผน</span>');
  if(p.pulled){const o=[...new Set(activeItems(p).flatMap(i=>itemPlans(i)).filter(k=>k!=='action'))];if(o.length)s+=`<div class="muted">+ ${o.map(k=>PLANS.find(x=>x[0]===k)[1]).join(', ')}</div>`;if(!p.planBatch)s=`<span>${o.map(k=>PLANS.find(x=>x[0]===k)[1]).join(', ')}</span>`}
  if(p.revisions.length)s+=`<div class="muted">เปลี่ยนแปลง ${p.revisions.length} ครั้ง</div>`;
  if(p.pendingChange)s+=`<div style="color:var(--accent)">รอเสนอเปลี่ยนแปลง</div>`;
  return s;
}

function readEditor(){
  const m=document.getElementById('modal');
  m.querySelectorAll('[data-p]').forEach(el=>{const k=el.dataset.p;let v=el.value;if(k==='budgetTotal')v=v===''?null:num(v);if(k==='seq')v=num(v);ED[k]=v});
  m.querySelectorAll('tr[data-k]').forEach(tr=>{const i=ED.items[tr.dataset.k];if(!i)return;tr.querySelectorAll('[data-f]').forEach(el=>{let v=el.value;if(el.dataset.f==='qty'||el.dataset.f==='budget'||el.dataset.f==='price')v=v===''?null:num(v);i[el.dataset.f]=v});i.months=[...tr.querySelectorAll('[data-m]')].filter(x=>x.checked).map(x=>Number(x.dataset.m));const mk=/^\s*จัด(ซื้อ|จ้าง|เช่า)/.exec(i.name||'');if(mk)i.kind=mk[1]});
  m.querySelectorAll('[data-c][data-cf]').forEach(el=>{ED.checks[el.dataset.c][el.dataset.cf]=el.value});
  const ar={};m.querySelectorAll('[data-c][data-area]').forEach(el=>{const k=el.dataset.c;ar[k]=ar[k]||[];if(el.checked)ar[k].push(el.dataset.area)});Object.entries(ar).forEach(([k,v])=>{ED.checks[k].areas=v});
}
function saveEditor(){
  readEditor();
  if(!ED.name.trim()){toast('กรุณาใส่ชื่อโครงการ');return}
  if(ED.hasBuy!==true&&ED.hasBuy!==false){toast('กรุณาติ๊กว่าโครงการมีรายการซื้อ/จ้าง/เช่าหรือไม่');return}
  if(ED.hasBuy===true&&!activeItems(ED).length&&!confirm('ติ๊กว่า "มี" รายการซื้อ/จ้าง/เช่า แต่ยังไม่ได้ลงรายการ บันทึกไว้ก่อนหรือไม่?'))return;
  const isNew=ED._new;const orig=ED._orig;delete ED._new;delete ED._orig;
  ED.checks=ED.checks.filter(c=>(c.result&&c.result.trim())||c.recvDate);
  const changedItems=!isNew&&orig!==null&&JSON.stringify(ED.items)!==orig;
  if(changedItems&&ED.planBatch&&!ED.pendingChange){
    const before=JSON.parse(orig);
    const onlyCancel=before.length===ED.items.length&&ED.items.every((i,k)=>JSON.stringify(Object.assign({},i,{cancelled:false,pendingCancel:false}))===JSON.stringify(Object.assign({},before[k],{cancelled:false,pendingCancel:false})));
    if(!onlyCancel){
      const reason=prompt('โครงการนี้อยู่ในแผนที่อนุมัติแล้ว การแก้ไขรายการจะถูกบันทึกเป็น "รอเสนอเปลี่ยนแปลงแผน"\nระบุเหตุผลการเปลี่ยนแปลง (ยกเลิก = ไม่บันทึก):','ผู้จัดทำโครงการเปลี่ยนแปลงรายการซื้อ/จ้าง');
      if(reason===null)return;
      ED.pendingChange={reason:reason||'เปลี่ยนแปลงรายการ',before:before.filter(i=>!i.cancelled),date:todayISO()};
    }
  }
  const ix=S.projects.findIndex(p=>p.id===ED.id);
  if(ix>=0)S.projects[ix]=ED;else S.projects.push(ED);
  save();closeModal();render();toast('บันทึกแล้ว');
}

function mkBatch(type){
  const cls={approve:'wa',change:'wc',cancel:'wx'}[type];
  const ids=[...document.querySelectorAll('.sel-'+cls+':checked')].map(x=>x.value);
  if(!ids.length){toast('ยังไม่ได้เลือกโครงการ');return}
  const b={id:uid('b'),fy:FY,type,no:fyBatches(type).length+1,date:todayISO(),memoNo:'',projectIds:ids,note:'',orderId:orderFor('action').id};
  let ps=ids.map(proj);
  if(type==='approve'){
    const bad=ps.filter(p=>activeItems(p).some(i=>!itemPlans(i).length));
    if(bad.length){
      if(bad.length===ps.length){alert('โครงการที่เลือกยังไม่ได้เลือกแผนครบทุกรายการ จึงยังไม่สร้างแผน\n(โครงการยังอยู่ในรายการรอเสนอ)');return}
      if(!confirm('โครงการต่อไปนี้ยังมีรายการที่ไม่ได้เลือกแผน จะยังไม่นำเข้าแผนครั้งนี้ (คงอยู่ในรายการรอเสนอ ทำภายหลังได้):\n- '+bad.map(p=>p.name).join('\n- ')+'\n\nสร้างแผนจากโครงการที่เหลือ '+(ps.length-bad.length)+' โครงการ ต่อเลยหรือไม่?'))return;
      ps=ps.filter(p=>!bad.includes(p));b.projectIds=ps.map(p=>p.id)}
    ps.forEach(p=>p.items.forEach(i=>{if(!i.cancelled)i.plans=itemPlans(i)}));
    const cnt={drug:0,supply:0,eq:0};
    ps.forEach(p=>{p.pulled=b.id;if(activeItems(p).some(i=>i.plans.includes('action')))p.planBatch=b.id;
      activeItems(p).forEach(i=>{if(i.plans.includes('eq')&&!S.eq.items.some(x=>x.itemId===i.id)){S.eq.items.push(eqFromItem(p,i));cnt.eq++}
        ['drug','supply'].forEach(k=>{if(i.plans.includes(k)&&drugFromItem(p,i,k))cnt[k]++})})});
    b.snapshot=ps.map(snapProject).filter(x=>x.items.length);
    if(!b.snapshot.length){b.noAction=true}
    b.routed=cnt;
  }
  if(type==='change'){b.snapshot=ps.map(snapProject);b.reasons={};ps.forEach(p=>{b.reasons[p.id]=p.pendingChange.reason;p.revisions.push({date:todayISO(),batchId:b.id,reason:p.pendingChange.reason,before:p.pendingChange.before});p.pendingChange=null})}
  if(type==='cancel'){b.snapshot=ps.map(p=>({projectId:p.id,name:p.name,code:p.code||'',unit:p.unit||'',items:JSON.parse(JSON.stringify(p.items.filter(i=>i.pendingCancel)))}));ps.forEach(p=>p.items.forEach(i=>{if(i.pendingCancel)i.pendingCancel=false}))}
  if(type==='approve'&&b.noAction){save();render();toast(`ส่งเข้าแผนอื่นแล้ว (ยา ${b.routed.drug} · เวชภัณฑ์ ${b.routed.supply} · ครุภัณฑ์ ${b.routed.eq}) — ไม่มีรายการเข้าแผนปฏิบัติการ`);return}
  S.batches.push(b);save();render();openExport(b);if(type==='approve'&&(b.routed.drug+b.routed.supply+b.routed.eq)){toast(`สร้างแผน ครั้งที่ ${b.no} แล้ว และส่งเข้า แผนยา ${b.routed.drug} · แผนเวชภัณฑ์ ${b.routed.supply} · แผนครุภัณฑ์ ${b.routed.eq} รายการ`);return}toast(`สร้าง${({approve:'แผน',change:'การเปลี่ยนแปลงแผน',cancel:'รายการยกเลิก'})[type]} ครั้งที่ ${b.no} แล้ว — กรอกเลขที่บันทึกและพิมพ์เอกสารได้ในตาราง ง.`);
}
function delBatch(id){
  const b=S.batches.find(x=>x.id===id);
  if(!confirm(`ลบ ${({approve:'แผน',change:'การเปลี่ยนแปลงแผน',cancel:'รายการยกเลิก'})[b.type]} ครั้งที่ ${b.no}? โครงการจะกลับไปอยู่ในรายการ "รอเสนอ"`))return;
  const un=b.type==='approve'&&b.projectIds.some(pid=>{const p=proj(pid);return p&&pStatus(p)==='signed'})&&confirm('ให้โครงการในแผนนี้กลับเป็น "ยังไม่ลงชื่อ" ด้วยหรือไม่?\n(ตกลง = ยกเลิกการลงชื่อ · ยกเลิก = คงการลงชื่อไว้)');
  b.projectIds.forEach(pid=>{const p=proj(pid);if(!p)return;
    if(un)unsign(p);
    if(b.type==='approve'&&p.planBatch===b.id)p.planBatch=null;
    if(b.type==='approve'&&p.pulled===b.id)p.pulled=null;
    if(b.type==='change'){const r=p.revisions.findIndex(r=>r.batchId===b.id);if(r>=0){const rv=p.revisions.splice(r,1)[0];p.pendingChange={reason:rv.reason,before:rv.before,date:rv.date}}}
    if(b.type==='cancel'){const names=new Set((b.snapshot.find(s=>s.projectId===pid)||{items:[]}).items.map(i=>i.id));p.items.forEach(i=>{if(names.has(i.id))i.pendingCancel=true})}
  });
  S.batches=S.batches.filter(x=>x!==b);S.batches.forEach(x=>{if(x.fy===b.fy&&x.type===b.type&&x.no>b.no)x.no--});save();render();toast('ลบแล้ว ครั้งที่ถัดไปเลื่อนเลขให้แล้ว');
}

function puCalc(x){const L=(x.lines||[]).filter(l=>(l.name||'').trim()||num(l.price));

const METHOD_TH={buy:'จัดซื้อ',hire:'จัดจ้าง',rent:'จัดเช่า'};
function jobToRows(job,fname){
  const items=job.items||[];
  const vatMode=items.some(i=>!i.vatExempt)?'excl':'none';
  const amount=r2(sum(items,i=>num(i.qty)*num(i.price)*(vatMode==='excl'&&!i.vatExempt?1.07:1)));
  const pre=METHOD_TH[job.method]||(job.rent?'จัดเช่า':'จัดซื้อ');
  let title=(job.jobTitle||job.type||'').trim();
  if(title&&/^(ซื้อ|จ้าง|เช่า)/.test(title))title='จัด'+title;else if(title&&!/^จัด(ซื้อ|จ้าง|เช่า)/.test(title))title=pre+title;
  const desc=(title||pre)+(items.length>1||!job.jobTitle?` จำนวน ${items.length} รายการ`:'');
  const date=parseThaiDate(job.po&&job.po.date)||parseThaiDate(job.announceDate)||parseThaiDate(job.ref&&job.ref.date)||null;
  const pjName=(job.project&&job.project.name)||'',pjCode=(job.project&&job.project.code)||'';
  let p=null;const cand=fyProjects().filter(x=>inPlan(x)&&!x.cancelled);
  if(pjCode)p=cand.find(x=>x.code&&x.code.trim()===pjCode.trim());
  if(!p&&pjName){const n=norm(pjName);p=cand.find(x=>norm(x.name)===n)||cand.find(x=>{const m=norm(x.name);const k=Math.min(n.length,m.length,30);return k>=10&&n.slice(0,k)===m.slice(0,k)})}
  let it=null;if(p){const kind={'จัดซื้อ':'ซื้อ','จัดจ้าง':'จ้าง','จัดเช่า':'เช่า'}[pre];const its=activeItems(p);it=its.find(i=>norm(i.name)===norm(title))||its.find(i=>i.kind===kind&&norm(title).includes(norm(i.name).slice(3,10)))||its.find(i=>i.kind===kind)||its[0]}
  const base={fname,vendor:(job.vendor&&job.vendor.name)||'',poNo:(job.po&&job.po.no)||'',date,projectId:p?p.id:'',itemId:it?it.id:'',pjName,pjCode,amount,desc,vatMode,lines:items.map(i=>({name:i.name||'',qty:i.qty??null,unit:i.unit||'',price:i.price??null,vatExempt:!!i.vatExempt})),months:(job.rent&&num(job.rent.months)>1)?num(job.rent.months):0,split:false};
  return base;
}

function batchTitle(b){return ({approve:'แผนปฏิบัติการจัดซื้อจัดจ้าง',change:'เปลี่ยนแปลงแผนปฏิบัติการจัดซื้อจัดจ้าง',cancel:'ยกเลิกรายการในแผนปฏิบัติการจัดซื้อจัดจ้าง'})[b.type]+` ประจำปีงบประมาณ พ.ศ. ${b.fy}`+(b.type==='approve'&&b.no>1?` (เพิ่มเติม ครั้งที่ ${b.no})`:b.type!=='approve'?` ครั้งที่ ${b.no}`:'')}
// split subject so only the first line (บรรทัดที่ 3) carries the dotted line; the rest wraps plainly
function splitSubj(t,cap=72){const base=x=>x.replace(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g,'').length;
  if(base(t)<=cap)return [t,''];let cut=-1;for(let i=0;i<t.length;i++){if(t[i]===' '&&base(t.slice(0,i))<=cap)cut=i}
  if(cut<=0){let n=0,i=0;for(;i<t.length;i++){if(!/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(t[i]))n++;if(n>cap)break}cut=i;return [t.slice(0,cut),t.slice(cut)]}
  return [t.slice(0,cut),t.slice(cut+1)]}

  const prevA=fyBatches('approve').filter(x=>b.type!=='approve'||x.no<b.no);
  const bh=t=>`<p class="ind" style="text-indent:1.25cm"><u>${t}</u></p>`;

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function planSheet(snap,name,title){

    sp.items.forEach((i,j)=>rows.push([j===0?k:'',j===0?sp.name:'',`${j+1}.${i.name}`,i.qty??'',i.unit||'',num(i.budget),i.fund||'',i.method||'',...MONTHS.map((x,m)=>j===mid&&a>=0&&m>=a&&m<=z?(a===z?'◄►':m===a?'◄───':m===z?'───►':'────'):'')]))});
  rows.push(['','รวมทั้งสิ้น','','','',r2(sum(snap,s=>sum(s.items,i=>num(i.budget)))),'','',...MONTHS.map(()=>'')]);

}

function backup(){
  S.meta.lastBackup=todayISO();save();
  const d=new Date();const stamp=`${d.getFullYear()+543}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const withFiles=(S.orders||[]).filter(o=>o.file);
  Promise.all(withFiles.map(o=>FDB.get('order:'+o.id).then(b=>b?blobToDataURL(b).then(u=>['order:'+o.id,u]):null).catch(()=>null))).then(fs=>{
    const files={};fs.filter(Boolean).forEach(([k,u])=>files[k]=u);
    dl(new Blob([JSON.stringify(Object.assign({_type:'bcn-plan-backup',_ver:1},S,{settings:Object.assign({},S.settings,{staffList:staff()}),_files:files}),null,1)],{type:'application/json'}),`สำรอง_ระบบตรวจโครงการ_${stamp}.json`);
    render()});

let fileMode='import';
function onFiles(files){
  const arr=[...files];if(!arr.length)return;
  Promise.all(arr.map(f=>f.text().then(t=>({name:f.name,t})))).then(list=>{
    if(fileMode==='restore'){
      try{const d=JSON.parse(list[0].t);if(d._type!=='bcn-plan-backup')throw 0;const cnt=`โครงการ ${(d.projects||[]).length} รายการ · แผน ${(d.batches||[]).length} ครั้ง · ตัดยอด ${(d.purchases||[]).length} รายการ · แผนยา/เวชภัณฑ์ ${((d.drug||{}).plans||[]).length} แผน · ครุภัณฑ์ ${((d.eq||{}).items||[]).length} รายการ`;if(!confirm('ไฟล์สำรอง '+list[0].name+'\n'+cnt+'\n\n'+(ONLINE?'กู้คืนจะแทนที่ข้อมูลทั้งหมดในระบบออนไลน์ (เจ้าหน้าที่ทุกคนจะเห็นข้อมูลชุดนี้แทนของเดิม)':'กู้คืนจะแทนที่ข้อมูลทั้งหมดในเครื่องนี้')+' ดำเนินการต่อ?'))return;delete d._type;delete d._ver;const files=d._files||{};delete d._files;S=d;load2();save();
        Promise.all(Object.entries(files).map(([k,u])=>FDB.put(k,dataURLToBlob(u)).catch(()=>{}))).then(()=>{render();toast('กู้คืนข้อมูลแล้ว'+(Object.keys(files).length?` (รวมไฟล์คำสั่ง ${Object.keys(files).length} ไฟล์)`:''))})}catch(e){alert('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบนี้')}
      return}
    const rows=[];const bad=[];
    list.forEach(({name,t})=>{try{const j=JSON.parse(t);if(j._type==='bcn-plan-backup'){bad.push(name+' (เป็นไฟล์สำรอง ใช้เมนูกู้คืน)');return}if(!Array.isArray(j.items)){bad.push(name);return}rows.push(jobToRows(j,name))}catch(e){bad.push(name)}});
    if(bad.length)alert('อ่านไฟล์ไม่ได้:\n'+bad.join('\n'));
    if(rows.length)openImport(rows);
  });
}

function dBuy(i){return Math.max(0,r2(num(i.estUse)-num(i.stock)))}
function dAmt(i){return r2(dBuy(i)*num(i.price))}
function dQAmt(i,k){return r2(num(i.q[k])*num(i.price))}
function dActQty(i){return r2(sum(i.act,a=>num(a&&a.qty)))}
function dActAmt(i){return r2(sum(i.act,a=>num(a&&a.amt)))}
function dRemQty(i){return r2(dBuy(i)-dActQty(i))}
function dRemAmt(i){return r2(dAmt(i)-dActAmt(i))}
function dAvg(i,fy=FY){const v=histYears(fy).map(y=>i.hist[y]).filter(x=>x!==null&&x!==undefined&&x!=='');return v.length?r2(sum(v,num)/v.length):null}
function dWarn(i){

    <div class="row" style="margin-top:8px"><span class="grow"></span><button class="btn" data-dact="prMemo">พิมพ์บันทึก</button><button class="btn" data-dact="docMemo">Word</button></div></div>`;

function dCreate(fromPrev){
  const kind=UI.drugKind;const prev=dPlan(kind,FY-1);
  const p={id:uid('dp'),fy:FY,kind,fund:prev?prev.fund:'เงินรายได้สถาบันพระบรมราชชนก',projectName:prev?prev.projectName:'',supplyType:prev?prev.supplyType||'':(kind==='supply'?'วัสดุการแพทย์ทั่วไป':''),items:[]};
  if(fromPrev&&prev){const y=histYears();p.items=prev.items.map(o=>{const n=dNewItem(kind);Object.assign(n,{name:o.name,type:o.type,unit:o.unit,price:o.price});
    n.hist[y[0]]=o.hist[y[0]]??null;n.hist[y[1]]=o.hist[y[1]]??null;
    if(o.actualUse!==null&&o.actualUse!==undefined&&o.actualUse!==''){n.hist[y[2]]=num(o.actualUse)}else{n.hist[y[2]]=o.estUse??null;n.histEst=true}
    return n})}
  S.drug.plans.push(p);save();render();
}
function dRead(el){ // apply single input change
  const p=dPlan(UI.drugKind);if(!p)return;const tr=el.closest('[data-dk]');const i=tr?p.items[tr.dataset.dk]:null;
  const nv=v=>v===''?null:num(v);
  const oldBuy=i?dBuy(i):0;const autoQ=i&&(sum(i.q,num)===0||(num(i.q[0])===oldBuy&&!num(i.q[1])&&!num(i.q[2])&&!num(i.q[3])));
  if(el.dataset.di){i[el.dataset.di]=['estUse','stock','price','actualUse'].includes(el.dataset.di)?nv(el.value):el.value}
  else if(el.dataset.dh){i.hist[el.dataset.dh]=nv(el.value);if(el.dataset.dh==FY-1)i.histEst=false}
  else if(el.dataset.dq!==undefined){i.q[+el.dataset.dq]=num(el.value)}
  else if(el.dataset.daq!==undefined){const q=+el.dataset.daq;i.act[q]=i.act[q]||{};i.act[q].qty=nv(el.value);if(i.act[q].qty&&(i.act[q].amt===null||i.act[q].amt===undefined))i.act[q].amt=r2(i.act[q].qty*num(i.price))}
  else if(el.dataset.daa!==undefined){const q=+el.dataset.daa;i.act[q]=i.act[q]||{};i.act[q].amt=nv(el.value)}
  else if(el.dataset.dp){p[el.dataset.dp]=el.value}
  if(i&&autoQ&&(el.dataset.di==='estUse'||el.dataset.di==='stock')&&dBuy(i)!==oldBuy)i.q=[dBuy(i),0,0,0];
  save();
}

function dHead(p,title){return `<div class="ptitle">${esc(title)}</div><div class="ptitle">หน่วยงาน ${esc(S.settings.org)}  จังหวัด สุรินทร์</div><div class="ptitle">ประจำปีงบประมาณ พ.ศ. ${p.fy}</div>`}
function dOrder(fy=FY){return orderFor('drug',dFy(fy).orderId,fy)}
function dSigs(fy){return sigBlock(dOrder(fy).committee.filter(c=>c.name))}

  <tr>${hy.map(y=>`<th>ปี ${y}</th>`).join('')}<th>จำนวน</th><th>มูลค่า (บาท)</th><th>จำนวน</th><th>มูลค่า (บาท)</th></tr>
  ${p.items.map((i,k)=>`<tr><td class="c">${k+1}</td><td>${esc(i.name)}</td><td class="c">${esc(i.type)}</td><td class="c">${esc(i.unit)}</td>${hy.map(y=>`<td class="c">${i.hist[y]??''}</td>`).join('')}<td class="c">${i.estUse??''}</td><td class="c">${i.stock??''}</td><td class="c">${dBuy(i)}</td><td class="n">${money(i.price)}</td><td class="n">${money(dAmt(i))}</td>${[0,1,2,3].map(q=>`<td class="n">${i.q[q]?money(dQAmt(i,q)):''}</td>`).join('')}<td class="c">${dActQty(i)||''}</td><td class="n">${dActAmt(i)?money(dActAmt(i)):''}</td><td class="c">${dRemQty(i)}</td><td class="n">${money(dRemAmt(i))}</td></tr>`).join('')}
  <tr><td></td><td class="c"><b>รวมทั้งสิ้น</b></td><td colspan="9"></td><td class="n"><b>${money(tot)}</b></td>${qt.map(v=>`<td class="n"><b>${v?money(v):''}</b></td>`).join('')}<td></td><td class="n"><b>${sum(p.items,dActAmt)?money(sum(p.items,dActAmt)):''}</b></td><td></td><td class="n"><b>${money(sum(p.items,dRemAmt))}</b></td></tr></table>${dSigs(p.fy)}`;

function dSumRows(p){ // per quarter: plan & actual
  const rows=[];
  const grp=p.kind==='drug'?[['ED',i=>i.type==='ED'],['NED',i=>i.type!=='ED']]:[['all',()=>true]];
  [0,1,2,3].forEach(q=>{
    const plan=grp.map(([g,f])=>{const its=p.items.filter(f).filter(i=>dQAmt(i,q)>0);return [its.length,r2(sum(its,i=>dQAmt(i,q)))]});
    const act=grp.map(([g,f])=>{const its=p.items.filter(f).filter(i=>num(i.act[q]&&i.act[q].amt)>0);return [its.length,r2(sum(its,i=>num(i.act[q].amt)))]});
    rows.push({q,type:'แผน',total:r2(sum(plan,x=>x[1])),g:plan},{q,type:'จัดซื้อจริง',total:r2(sum(act,x=>x[1])),g:act});
  });
  const tp=grp.map((x,gi)=>[new Set(p.items.filter(x[1]).filter(i=>dAmt(i)>0).map(i=>i.id)).size,r2(sum(rows.filter(r=>r.type==='แผน'),r=>r.g[gi][1]))]);
  const ta=grp.map((x,gi)=>[new Set(p.items.filter(x[1]).filter(i=>dActAmt(i)>0).map(i=>i.id)).size,r2(sum(rows.filter(r=>r.type!=='แผน'),r=>r.g[gi][1]))]);
  const tr=grp.map((x,gi)=>(tp[gi][1]||ta[gi][1])?[new Set(p.items.filter(x[1]).filter(i=>dRemAmt(i)>0).map(i=>i.id)).size,r2(tp[gi][1]-ta[gi][1])]:[0,null]);
  rows.push({q:4,type:'แผน',total:r2(sum(tp,x=>x[1])),g:tp,span:3},{q:4,type:'จัดซื้อจริง',total:r2(sum(ta,x=>x[1])),g:ta},{q:4,type:'คงเหลือ',total:r2(sum(tr,x=>x[1])),g:tr,rem:true});
  return rows;
}
function dSumHTML(p){
  const rows=dSumRows(p);const lab=q=>q<4?QS[q]:'รวมทั้งสิ้น';
  const cell=(n,v)=>`<td class="c">${n||''}</td><td class="n">${v?money(v):''}</td>`;
  const head=p.kind==='drug'?`<tr><th rowspan="2" colspan="2">การจัดซื้อ</th><th rowspan="2">มูลค่ารวม<br>(บาท)</th><th colspan="2">ยาในบัญชียาหลักแห่งชาติ</th><th colspan="2">ยานอกบัญชียาหลักแห่งชาติ</th><th rowspan="2">หมวดเงินงบประมาณ</th></tr><tr><th>จำนวนรายการ</th><th>บาท</th><th>จำนวนรายการ</th><th>บาท</th></tr>`
    :`<tr><th rowspan="2" colspan="2">การจัดซื้อ</th><th colspan="3">เวชภัณฑ์ที่มิใช่ยา${p.supplyType?' ประเภท '+esc(p.supplyType):''}</th></tr><tr><th>จำนวนรายการ</th><th>บาท</th><th>หมวดเงินงบประมาณ</th></tr>`;
  const cellR=(n,v)=>`<td class="c">${n||''}</td><td class="n">${v===null?'':money(v)}</td>`;
  const body=rows.map((r,k)=>`<tr>${r.type==='แผน'?`<td rowspan="${r.span||2}">${lab(r.q)}</td>`:''}<td>${r.type}</td>${p.kind==='drug'?`<td class="n">${r.total||r.rem?money(r.total):''}</td>${r.g.map(x=>(r.rem?cellR:cell)(x[0],x[1])).join('')}<td>${r.total?esc(p.fund):''}</td>`:`${(r.rem?cellR:cell)(r.g[0][0],r.g[0][1])}<td>${r.total?esc(p.fund):''}</td>`}</tr>`).join('');
  return dHead(p,dTitle(p,'สรุปแผนการจัดซื้อ'))+`<table class="pt" style="margin-top:8px">${head}${body}</table>${dSigs(p.fy)}`;
}

   `2. พระราชบัญญัติข้อมูลข่าวสารของราชการ พ.ศ. 2540 มาตรา 9 (8) ที่ระบุหน่วยงานของรัฐต้องจัดให้มีข้อมูลข่าวสารของราชการ เพื่อให้ประชาชนเข้าตรวจดูได้ โดยการจัดทำแผนปฏิบัติการจัดซื้อจัดจ้าง ประจำปีงบประมาณ เสนอผู้บริหารของหน่วยงานอนุมัติ`,

function eqFy(fy=FY){const prev=S.eq.byFy[fy-1];S.eq.byFy[fy]=S.eq.byFy[fy]||{maker:JSON.parse(JSON.stringify(prev?prev.maker:{name:'',pos:'นักวิชาการพัสดุ',role:'เจ้าหน้าที่'})),checker:JSON.parse(JSON.stringify(prev?prev.checker:{name:'',pos:''}))};return S.eq.byFy[fy]}
function eqItems(fy=FY){return S.eq.items.filter(i=>i.fy===fy).sort((a,b)=>(a.seq||0)-(b.seq||0))}
function thMonth(ym,short){if(!ym)return '';const [y,m]=ym.split('-').map(Number);return short?`${TH_MONTHS_S[m-1]} ${String(y+543).slice(2)}`:`${TH_MONTHS[m-1]} ${y+543}`}
function mil(v){if(v===null||v===undefined||v==='')return '';const x=num(v)/1e6;let s=x.toFixed(4).replace(/0+$/,'');if(/\.\d$/.test(s))s+='0';if(/\.$/.test(s))s+='00';return s}
function eqPaid(i){ // actual paid: manual value, else from linked plan item ledger
  const lb=i.itemId?usedOf(i.itemId):0;
  const pb=i.res.paidBudget!==null&&i.res.paidBudget!==undefined&&i.res.paidBudget!==''?num(i.res.paidBudget):(num(i.budget)>0||!num(i.offBudget)?lb:0);
  const po=i.res.paidOff!==null&&i.res.paidOff!==undefined&&i.res.paidOff!==''?num(i.res.paidOff):(!(num(i.budget)>0)&&num(i.offBudget)?lb:0);
  return {pb,po,fromLedger:!!i.itemId&&(i.res.paidBudget===null||i.res.paidBudget===undefined||i.res.paidBudget==='')};
}
function eqOnPlan(i){
  if(i.res.onPlan==='yes')return true;if(i.res.onPlan==='no')return false;
  if(!i.res.dlvDate)return null;
  const p=eqPaid(i);const okTime=!i.dlvMonth||i.res.dlvDate.slice(0,7)<=i.dlvMonth;const okMoney=(p.pb+p.po)<=num(i.budget)+num(i.offBudget)+0.001;
  return okTime&&okMoney;
}

function eqFromItem(p,i){
  const n=eqNew();const fyStart=FY-544;

  const ms=i.months&&i.months.length?Math.min(...i.months):undefined;
  Object.assign(n,{projectName:p.name,name:i.name.replace(/^จัด(ซื้อ|จ้าง|เช่า)\s*/,''),qty:i.qty,unit:i.unit,kind:i.kind==='จ้าง'?'จ้าง':'ซื้อ',method:/bidding|ประกวด/.test(i.method||'')?'ประกวดราคา':'เฉพาะเจาะจง',budget:num(i.budget),itemId:i.id,annMonth:mo(ms),signMonth:mo(ms),dlvMonth:''});

function drugFromItem(p,i,kind){
  let pl=dPlan(kind);if(!pl){pl={id:uid('dp'),fy:FY,kind,fund:'เงินรายได้สถาบันพระบรมราชชนก',projectName:p.name,supplyType:kind==='supply'?'วัสดุการแพทย์ทั่วไป':'',items:[]};S.drug.plans.push(pl)}
  if(pl.items.some(x=>x.fromItem===i.id))return false;
  const n=dNewItem(kind);const q=num(i.qty)||1;Object.assign(n,{name:i.name.replace(/^จัดซื้อ\s*/,''),unit:i.unit,estUse:q,stock:0,price:r2(num(i.budget)/q),q:[q,0,0,0],fromItem:i.id,fromProject:p.name});
  if(!pl.projectName)pl.projectName=p.name;pl.items.push(n);return true;
}
function openPullProj(target){
  const has=i=>target==='eq'?S.eq.items.some(x=>x.itemId===i.id):S.drug.plans.some(pl=>pl.fy===FY&&pl.kind===target&&pl.items.some(x=>x.fromItem===i.id));

  const ks=[...document.querySelectorAll('.ppc:checked')].map(x=>+x.value);const tg=MD.target;let n=0;

  if(t.dataset.ir==='projectId'){readImport();const r=MD.rows[t.closest('[data-row]').dataset.row];const p=proj(r.projectId);r.itemId=p&&activeItems(p)[0]?activeItems(p)[0].id:'';drawImport();return}
  if(t.classList&&t.classList.contains('qcFix')){const v=[...document.querySelectorAll('.qcFix:checked')].map(x=>x.value);const el=document.getElementById('qcRes');const other=el.value.split(/\s*;\s*/).filter(x=>x&&!S.settings.chkFix.includes(x));el.value=[...v,...other].join('; ');el.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(t.id==='ownAdd'&&ED&&staffFind(t.value)){addOwner();return}
  if(t.list&&t.list.id==='staffList'&&t.dataset.posto){const f=staffFind(t.value);if(f){const tg=document.querySelector(t.dataset.posto);if(tg&&!tg.value.trim()||tg&&tg.dataset.auto!=='0'){tg.value=f.pos;tg.dispatchEvent(new Event('change',{bubbles:true}))}}}
  if(t.id==='chkFix'&&t.value&&ED){readEditor();addRound(ED,t.value);drawEditor();return}
  if(t.id==='repProj'){UI.repProject=t.value;render();return}
  if(t.id==='repFund'){UI.repFund=t.value;render();return}
  if(t.dataset&&t.dataset.ires){for(const p of S.projects){const i=p.items.find(x=>x.id===t.dataset.ires);if(i){i[t.dataset.iresf]=t.value;save();if(t.dataset.iresf==='resOk')render();break}}return}
  if(t.id==='ppAll'){document.querySelectorAll('.ppc').forEach(x=>x.checked=t.checked);return}
  if(t.id==='cpAll'){document.querySelectorAll('.cp').forEach(x=>x.checked=t.checked);return}
  if(t.classList.contains('selall')){document.querySelectorAll('.sel-'+t.dataset.cls).forEach(x=>x.checked=t.checked);return}
  if(t.dataset.o&&(t.dataset.of||t.dataset.oplan||t.dataset.ocm!==undefined)){const o=S.orders.find(x=>x.id===t.dataset.o);if(t.dataset.of)o[t.dataset.of]=t.value;else if(t.dataset.oplan){const st=new Set(o.plans);t.checked?st.add(t.dataset.oplan):st.delete(t.dataset.oplan);o.plans=[...st]}else o.committee[+t.dataset.ocm][t.dataset.ocmf]=t.value;save();return}
  if(t.dataset.route){const p=proj(t.dataset.pid);const i=p.items.find(x=>x.id===t.dataset.route);const s2=new Set(itemPlans(i));t.checked?s2.add(t.dataset.pl):s2.delete(t.dataset.pl);i.plans=[...s2];save();return}
  if(t.dataset.bf){const b=S.batches.find(x=>x.id===t.dataset.id);b[t.dataset.bf]=t.value;save();return}
  if(t.dataset.fs){fySet()[t.dataset.fs]=t.value;save();return}
  if(t.dataset.cm!==undefined){fySet().committee[+t.dataset.cm][t.dataset.cmf]=t.value;save();return}
  if(t.dataset.s){const [a,b]=t.dataset.s.split('.');if(b)S.settings[a][b]=t.value;else S.settings[a]=t.value;save();toast('บันทึกการตั้งค่าแล้ว');return}
  if(t.dataset.sll){S.settings[t.dataset.sll]=t.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);save();renderUnitList();toast('บันทึกรายการแล้ว');return}
  if(t.dataset.sl){S.settings[t.dataset.sl]=t.value.split(',').map(x=>x.trim()).filter(Boolean);save();toast('บันทึกการตั้งค่าแล้ว');return}
  if(t.id==='fileIn'){onFiles(t.files);t.value='';return}
});
document.addEventListener('input',e=>{const tr=e.target.closest&&e.target.closest('tr[data-k]');
  if(tr&&ED&&e.target.dataset.f&&['qty','price','budget','fund'].includes(e.target.dataset.f)){
    const g=f=>tr.querySelector(`[data-f="${f}"]`);if(e.target.dataset.f!=='budget'&&g('price').value!==''){g('budget').value=r2(num(g('qty').value||1)*num(g('price').value))}
    const fs={};let tot=0,n=0;document.querySelectorAll('#modal tr[data-k]').forEach(r=>{const i=ED.items[r.dataset.k];if(!i||i.cancelled)return;const b=num(r.querySelector('[data-f="budget"]').value),f=r.querySelector('[data-f="fund"]').value||'?';tot+=b;n++;fs[f]=(fs[f]||0)+b});
    const a=document.getElementById('edSumTot'),t=document.getElementById('edSumTxt');if(a)a.textContent=money(tot);if(t)t.textContent=`รวม ${n} รายการ `+Object.entries(fs).map(([f,v])=>`· ${f} ${money(v)}`).join(' ')}
  if(e.target.id==='staffSearch'){UI.staffQ=e.target.value;const pos=e.target.selectionStart;render();const x=document.getElementById('staffSearch');x.focus();x.setSelectionRange(pos,pos);return}
  if(e.target.id==='qcRes'){const v=e.target.value.trim(),cl=v?classify(v):'';const b=document.getElementById('qcSendBox');if(b)b.style.display=v?'':'none';const sl=document.getElementById('qcSendLbl');if(sl)sl.textContent=cl==='fix'?'ส่งกลับให้ผู้รับผิดชอบแก้ไขแล้ว เมื่อวันที่':'ส่งคืนผู้รับผิดชอบแล้ว เมื่อวันที่ (ยังไม่ส่งให้เอาติ๊กออก)';const ab=document.getElementById('qcAreaBox');if(ab){ab.style.display=cl==='fix'?'':'none';const g=cl==='fix'?guessAreas(v):[];document.querySelectorAll('.qcArea').forEach(x=>x.checked=g.includes(x.value))}const l=document.getElementById('qcDateLbl');if(l)l.textContent=cl==='signed'?'วันที่ลงนาม':'วันที่ตรวจ'}
  if(e.target.id==='chkSearch'){UI.chkSearch=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById('chkSearch');s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{const el=e.target;if(el&&el.tagName==='INPUT'&&(el.type==='date'||el.type==='month')&&!el.disabled&&el.showPicker){try{el.showPicker()}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ownAdd'){e.preventDefault();addOwner();return}if(e.key==='Escape'&&document.getElementById('modal').innerHTML)closeModal()});

function dateHints(){document.querySelectorAll('input[type=date],input[type=month]').forEach(el=>{let h=el.nextElementSibling;if(!h||!h.classList.contains('dthint')){h=document.createElement('span');h.className='dthint';el.after(h)}h.textContent=el.value?(el.type==='month'?thMonth(el.value):thDate(el.value,false)):''})}
new MutationObserver(()=>{clearTimeout(window.__dh);window.__dh=setTimeout(dateHints,0)}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('input',e=>{if(e.target.type==='date'||e.target.type==='month'){const h=e.target.nextElementSibling;if(h&&h.classList.contains('dthint'))h.textContent=e.target.value?(e.target.type==='month'?thMonth(e.target.value):thDate(e.target.value,false)):''}});
if(ONLINE)CLOUD.boot();else{load();renderStaffList();renderUnitList();render();}
