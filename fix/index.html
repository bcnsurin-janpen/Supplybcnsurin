<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบแจ้งซ่อมออนไลน์ - วิทยาลัยพยาบาลบรมราชชนนี สุรินทร์</title>
<style>
:root{
  --teal-900:#0b3b3b; --teal-800:#0f4c4c; --teal-700:#136161; --teal-600:#177a7a;
  --amber-500:#f59e0b; --amber-100:#fef3c7; --amber-800:#92400e; --amber-300:#fcd34d;
  --sky-600:#0284c7; --sky-100:#e0f2fe; --sky-800:#075985; --sky-300:#7dd3fc;
  --emerald-600:#059669; --emerald-100:#d1fae5; --emerald-800:#065f46; --emerald-300:#6ee7b7;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
  --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
  --rose-500:#f43f5e; --rose-100:#ffe4e6;
  font-family:-apple-system,"Segoe UI","Sarabun","Leelawadee UI","Tahoma",sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--slate-100);color:var(--slate-800);}
#app{max-width:1200px;margin:0 auto;background:var(--slate-50);min-height:100vh;border-left:1px solid var(--slate-200);border-right:1px solid var(--slate-200);}

.topbar{background:var(--teal-900);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:36px;height:36px;border-radius:10px;background:var(--teal-700);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.brand-title{font-weight:600;font-size:14px;line-height:1.3;}
.brand-sub{font-size:11px;color:#cfe8e8;}

.bell-wrap{position:relative;}
.bell-btn{background:none;border:none;color:#fff;cursor:pointer;padding:8px;border-radius:8px;font-size:18px;position:relative;}
.bell-btn:hover{background:var(--teal-800);}
.bell-badge{position:absolute;top:-2px;right:-2px;background:var(--amber-500);color:#1a1a1a;font-size:10px;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700;}
.notif-panel{position:absolute;right:0;top:44px;width:320px;max-height:380px;overflow-y:auto;background:#fff;color:var(--slate-700);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);border:1px solid var(--slate-200);z-index:50;}
.notif-head{padding:10px 12px;border-bottom:1px solid var(--slate-200);font-size:11px;font-weight:600;color:var(--slate-500);}
.notif-item{padding:8px 12px;border-bottom:1px solid var(--slate-100);font-size:12px;display:flex;gap:8px;}
.notif-empty{padding:16px;font-size:12px;color:var(--slate-400);}

.tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--slate-200);padding:0 8px;}
.tab-btn{background:none;border:none;padding:11px 12px;font-size:13px;color:var(--slate-500);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tab-btn.active{color:var(--teal-800);font-weight:600;border-bottom-color:var(--teal-700);}
.tab-btn:hover{color:var(--teal-700);}

.body{padding:18px;}
.grid{display:grid;gap:18px;}
@media(min-width:1000px){.grid-2{grid-template-columns:2fr 3fr;} .grid-2b{grid-template-columns:1fr 1fr;} .grid-4{grid-template-columns:repeat(4,1fr);}}
@media(max-width:999px){.grid-4{grid-template-columns:repeat(2,1fr);}}

.card{background:#fff;border:1px solid var(--slate-200);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);padding:16px;}
.card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;}
.card h3{margin:0 0 10px;font-size:13px;color:var(--slate-600);}
.hint{font-size:12px;color:var(--slate-400);margin:0 0 14px;}

label.field{display:block;margin-bottom:12px;}
label.field .lab{display:block;font-size:13px;color:var(--slate-600);margin-bottom:4px;}
.req{color:var(--rose-500);}
.inp,select,textarea,input[type=text],input[type=date],input[type=number],input[type=tel]{
  width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--slate-800);font-family:inherit;
}
.inp:focus,select:focus,textarea:focus,input:focus{outline:2px solid var(--teal-600);outline-offset:0;border-color:var(--teal-600);}
.btn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--teal-700);color:#fff;}
.btn-primary:hover{background:var(--teal-900);}
.btn-primary:disabled{background:var(--slate-300);cursor:not-allowed;}
.btn-sky{background:var(--sky-600);color:#fff;}
.btn-block{width:100%;padding:11px;}
.btn-ghost{background:var(--slate-100);color:var(--slate-700);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn-danger{background:none;color:var(--rose-500);border:none;cursor:pointer;}

.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-slate{background:var(--slate-100);color:var(--slate-700);border-color:var(--slate-300);}
.badge-amber{background:var(--amber-100);color:var(--amber-800);border-color:var(--amber-300);}
.badge-sky{background:var(--sky-100);color:var(--sky-800);border-color:var(--sky-300);}
.badge-emerald{background:var(--emerald-100);color:var(--emerald-800);border-color:var(--emerald-300);}
.badge-violet{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd;}
.badge-rose{background:var(--rose-100);color:#9f1239;border-color:#fda4af;}

.steps{display:flex;align-items:flex-start;width:100%;margin:10px 0;}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:70px;}
.step-circle{width:26px;height:26px;border-radius:999px;border:2px solid var(--slate-300);color:var(--slate-400);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.step-circle.done{background:var(--teal-700);border-color:var(--teal-700);color:#fff;}
.step-circle.active{border-color:var(--teal-700);color:var(--teal-700);}
.step-label{font-size:10px;color:var(--slate-400);text-align:center;white-space:nowrap;}
.step-label.active{color:var(--teal-700);font-weight:600;}
.step-line{flex:1;height:2px;background:var(--slate-200);margin-top:12px;}
.step-line.done{background:var(--teal-700);}

.req-row{border:1px solid var(--slate-200);border-radius:10px;padding:12px;margin-bottom:8px;}
.req-row-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer;flex-wrap:wrap;}
.req-title{font-size:13px;font-weight:600;color:var(--slate-800);}
.req-sub{font-size:11px;color:var(--slate-400);margin-top:2px;}
.req-detail{margin-top:12px;padding-top:10px;border-top:1px solid var(--slate-100);display:none;}
.req-detail.open{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;color:var(--slate-500);margin-top:14px;}

.stat-card{display:flex;align-items:center;gap:12px;}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.stat-val{font-size:22px;font-weight:700;line-height:1.1;}
.stat-lab{font-size:11px;color:var(--slate-500);}

.pill-group{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.pill{border:1px solid var(--slate-300);background:#fff;color:var(--slate-500);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;}
.pill.active{background:var(--teal-700);border-color:var(--teal-700);color:#fff;}

.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
.bar-label{width:170px;flex:none;color:var(--slate-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;background:var(--slate-100);border-radius:5px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:var(--teal-700);border-radius:5px;}
.bar-val{width:26px;text-align:right;color:var(--slate-500);flex:none;}

table.simple{width:100%;border-collapse:collapse;font-size:12px;}
table.simple th{text-align:left;color:var(--slate-400);font-weight:500;padding:6px 10px 6px 0;border-bottom:1px solid var(--slate-200);}
table.simple td{padding:7px 10px 7px 0;border-bottom:1px solid var(--slate-100);color:var(--slate-600);}

.empty{text-align:center;padding:40px 10px;color:var(--slate-400);font-size:13px;}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--slate-200);}
.modal-head h3{margin:0;font-size:14px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--slate-400);cursor:pointer;}
.modal-body{padding:18px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--slate-800);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);}

.admin-tabs-content{display:grid;gap:14px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--slate-100);}
.list-row .sub{color:var(--slate-400);font-size:11px;}
.inline-form{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.inline-form > *{flex:1;min-width:140px;}
.small-note{font-size:11px;color:var(--slate-400);display:flex;gap:6px;align-items:flex-start;margin-top:12px;}
.center-col{max-height:380px;overflow-y:auto;}

.assign-row{display:grid;grid-template-columns:1fr;gap:10px;border:1px solid var(--slate-200);border-radius:10px;padding:14px;margin-bottom:10px;}
@media(min-width:900px){.assign-row{grid-template-columns:2fr 1fr 1fr;align-items:end;}}
.assign-actions{display:flex;gap:6px;}

.hidden{display:none !important;}
.identity-select{background:#fff;color:var(--slate-800);border:1px solid var(--slate-300);border-radius:8px;padding:6px 10px;font-size:12px;max-width:240px;font-weight:600;}
.identity-select option{color:#1e293b;background:#fff;}
.lock-note{font-size:11px;color:var(--slate-600);background:var(--slate-100);border:1px solid var(--slate-200);border-radius:7px;padding:6px 10px;display:inline-block;font-weight:600;}
.clickable{cursor:pointer;}
.clickable:hover{background:var(--slate-50);}
.notif-close{background:none;border:none;color:var(--slate-400);cursor:pointer;font-size:13px;}
.load-more-wrap{text-align:center;margin-top:12px;}
.techresult-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--slate-100);color:var(--slate-500);margin-left:6px;}
.guest-banner{background:var(--amber-100);color:var(--amber-800);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px;font-weight:600;}
.tech-check-list{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto;border:1px solid var(--slate-200);border-radius:8px;padding:8px;background:#fff;}
.tech-check-list label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--slate-700);}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.row-actions button{font-size:11px;padding:5px 9px;}
.readonly-banner{background:var(--slate-100);color:var(--slate-700);border:1px solid var(--slate-200);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;font-weight:600;}
.brand-clickable{cursor:pointer;}
.brand-clickable:hover .brand-title{text-decoration:underline;}
.logout-btn{background:var(--teal-800);color:#fff;border:1px solid var(--teal-700);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;}
.logout-btn:hover{background:var(--teal-700);}

.login-screen{min-height:560px;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--teal-900),var(--teal-700));}
.login-card{background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.login-card h1{font-size:16px;margin:0 0 4px;color:var(--slate-800);}
.login-card .sub{font-size:12px;color:var(--slate-500);margin-bottom:18px;}
.login-guest-link{display:block;text-align:center;font-size:12px;color:var(--slate-400);margin-top:14px;background:none;border:none;cursor:pointer;text-decoration:underline;width:100%;}


.msg{color:#b42318;min-height:1.3em;font-size:12px;margin:2px 0 8px}.msg.ok{color:#1f7a3f}
.mask{color:var(--slate-400);font-style:italic;font-size:11px}
.pwrow,.pw{display:flex;gap:6px;align-items:center}.pw .inp{flex:1}
button.eye{border:1px solid var(--slate-300);background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;flex:none}
.linkrow{display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap}
button.lnk{background:none;border:none;color:var(--teal-700);text-decoration:underline;cursor:pointer;font-size:12px;padding:2px}
button.lnk.guest{display:block;width:100%;margin-top:14px;color:var(--slate-500)}
.foot{text-align:center;font-size:11px;color:var(--slate-500);padding:14px 10px 22px}.foot a{color:var(--teal-700)}
.login-card .foot{padding:14px 0 0}
#gate{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:300;overflow:auto}
#gate .gov{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#gate .gbox{background:#fff;border-radius:14px;padding:22px;max-width:520px;width:100%}
#gate h3{margin:0 0 12px}.grow{display:flex;gap:8px;margin-top:10px}
.toast.bad{background:#9f1239}
.admin-tabs-content{display:block}
</style>

<body>
<div id="app"><div style="padding:60px 20px;text-align:center;color:#64748b;font-size:14px">กำลังโหลดระบบ...</div></div>
<script>
/* ====== ระบบแจ้งซ่อมออนไลน์ (/fix/) — หน้าเว็บ ไม่มีข้อมูลบุคคลฝังอยู่ในไฟล์ ข้อมูลทั้งหมดมาจากฐานข้อมูลหลังเข้าสู่ระบบ ====== */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DEF_PW = "123456789";
const STATUS = {
  new: { label: "รอส่วนกลางมอบหมาย", step: 1, color: "slate" },
  assigned: { label: "มอบหมายแล้ว รอส่งซ่อม", step: 2, color: "amber" },
  writer_sent: { label: "ส่งซ่อมแล้ว รอช่างรับเรื่อง", step: 3, color: "amber" },
  tech_received: { label: "ช่างรับเรื่อง/ออกเลขแล้ว รอตรวจสอบ", step: 4, color: "sky" },
  tech_inspected: { label: "ช่างตรวจสอบแล้ว กำลังพิจารณา", step: 4, color: "sky" },
  tech_done: { label: "ส่งพัสดุแล้ว รอพัสดุดำเนินการ", step: 5, color: "violet" },
  warehouse_in_progress: { label: "พัสดุอยู่ระหว่างดำเนินการ", step: 5, color: "violet" },
  tech_final_repair: { label: "พัสดุจัดเตรียมแล้ว ส่งช่างซ่อมขั้นสุดท้าย", step: 5, color: "violet" },
  completed: { label: "เสร็จสิ้น", step: 6, color: "emerald" },
  cancelled: { label: "ยกเลิก", step: 0, color: "rose" }
};
const STEP_LABELS = ["แจ้งซ่อม", "มอบหมาย", "ส่งซ่อม", "ช่างดำเนินการ", "พัสดุ/ซ่อมขั้นสุดท้าย", "เสร็จสิ้น"];
const WAREHOUSE_REASONS = ["เบิกวัสดุในคลัง", "จัดซื้อวัสดุ", "จ้างเอกชนดำเนินการ", "แทงชำรุด", "แทงชำรุดเพื่อซื้อทดแทน"];
const REASONS_RETURN_TO_TECH = ["เบิกวัสดุในคลัง", "จัดซื้อวัสดุ"];
const GROUPS = [["writer", "ผู้เขียนใบส่งซ่อม"], ["technician", "ช่าง"], ["warehouse", "เจ้าหน้าที่พัสดุ"], ["dispatcher", "ส่วนกลาง (ผู้จ่ายงาน)"], ["supervisor", "ผู้กำกับติดตาม"], ["admin", "ผู้ดูแลระบบ"]];
const GROUP_LABEL = {}; GROUPS.forEach(function (g) { GROUP_LABEL[g[0]] = g[1]; });
const ROLES = [
  { id: "requester", label: "ผู้แจ้งซ่อม", icon: "📷" }, { id: "central", label: "ส่วนกลาง (จ่ายงาน)", icon: "📤" },
  { id: "writer", label: "ผู้เขียนใบส่งซ่อม", icon: "📋" }, { id: "technician", label: "ช่าง", icon: "🔧" },
  { id: "warehouse", label: "เจ้าหน้าที่พัสดุ", icon: "📦" }, { id: "assets", label: "ทะเบียนครุภัณฑ์", icon: "📄" },
  { id: "dashboard", label: "แดชบอร์ด/รายงาน", icon: "📊" }, { id: "admin", label: "ผู้ดูแลระบบ", icon: "🔧" }
];
let ME = null, SET = {}, RESP = {}, REQS = [], ASSETS = null, ROLE = "requester", EXPANDED = null;
let PERIOD = "month", PERIOD_OFFSET = 0, ADMIN_TAB = "members", MODAL = null, ASSIGN_PICKS = {}, ASSET_SHOWN = 300, IDENTITY = "";
let pollT = null, MEMBERS = [];

const $ = function (id) { return document.getElementById(id); };
const esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
const attr = function (s) { return esc(s).replace(/`/g, "&#96;"); };
const jsAttr = function (s) { return esc(JSON.stringify(String(s == null ? "" : s))); };
const fmtDate = function (v) { if (!v) return "-"; var d = new Date(v); return isNaN(d) ? "-" : d.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" }); };
const fmtDateTime = function (v) { if (!v) return "-"; var d = new Date(v); return isNaN(d) ? "-" : d.toLocaleString("th-TH", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const todayInput = function () { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const daysBetween = function (a, b) { if (!a || !b) return null; return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000)); };
const dash = function (v) { return v == null || v === "" ? "-" : v; };

function isAdmin() { return !!ME && ME.isAdmin; }
function hasGroup(g) { return !!ME && (ME.groups || []).indexOf(g) >= 0; }
function canAct(g) { return isAdmin() || hasGroup(g); }
function isStaff() { return !!ME && ((ME.groups || []).length > 0); }
function visibleTabs() { return ROLES.filter(function (r) { return r.id !== "admin" || isAdmin(); }); }

/* ---------- เรียกฐานข้อมูล ---------- */
async function rpc(name, args) { var r = await sb.rpc(name, args || {}); if (r.error) throw r.error; return r.data; }
function errMsg(e) {
  var m = (e && e.message) || "";
  if (/bad_state/.test(m)) return "สถานะงานนี้เปลี่ยนไปแล้ว (อาจมีผู้อื่นดำเนินการก่อน) กรุณากดรีเฟรชรายการ";

  try {
    var d = await rpc("fix_admin_export");
    var blob = new Blob([JSON.stringify(d)], { type: "application/json" }), url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "fix-backup-" + todayInput() + ".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("ดาวน์โหลดไฟล์สำรองแล้ว (บันทึกในประวัติการใช้งาน)");
  } catch (e) { showToast(errMsg(e), true); }
}
async function doRestore() {
  var m = $("restoreMsg"), f = $("restoreFile").files[0]; m.textContent = "";
  if (!f) { m.textContent = "เลือกไฟล์สำรองก่อน"; return; }
  if ($("restoreConfirm").value.trim() !== "กู้คืน") { m.textContent = 'พิมพ์คำว่า "กู้คืน" เพื่อยืนยัน'; return; }
  var obj; try { obj = JSON.parse(await f.text()); } catch (e) { m.textContent = "อ่านไฟล์ไม่ได้ ไม่ใช่ไฟล์ .json"; return; }
  if (!obj || obj.app !== "fix" || !Array.isArray(obj.requests)) { m.textContent = "ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบแจ้งซ่อม"; return; }
  if (!confirm("ยืนยันกู้คืน? ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยไฟล์ที่เลือก (งาน " + obj.requests.length + " รายการ)")) return;
  try {
    var msg = await rpc("fix_admin_restore", { p: obj });
    var b = await rpc("fix_bootstrap"); ME = b.me; SET = b.settings || {}; RESP = b.responsible || {}; REQS = await rpc("fix_list");
    showToast(msg); renderTabs(); loadAdminTab();
  } catch (e) { m.textContent = errMsg(e); }
}

/* ---------- เริ่มทำงาน ---------- */
(async function boot() {
  sb.auth.onAuthStateChange(function (ev) { if (ev === "PASSWORD_RECOVERY") pwView(false, true); });
  if (/type=recovery/.test(location.hash)) return;
  try { var s = await sb.auth.getSession(); if (s && s.data && s.data.session) return afterLogin(); } catch (e) {}
  showLogin();
})();

</script>
